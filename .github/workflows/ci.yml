name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint, unit & e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitcore
          POSTGRES_PASSWORD: fitcore
          POSTGRES_DB: fitcore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitcore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://fitcore:fitcore@localhost:5432/fitcore?schema=public
      JWT_SECRET: ci-only-secret-not-used-in-production
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma generate
      - name: Apply schema to the database
        run: pnpm prisma db push
      - name: Seed
        run: pnpm seed
      - name: Unit tests
        run: pnpm test
      - name: E2E tests
        run: pnpm test:e2e

  frontend:
    name: Frontend (typecheck & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build (includes type-check)
        run: pnpm build
