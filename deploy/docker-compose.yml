version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitcore
      POSTGRES_PASSWORD: fitcore
      POSTGRES_DB: fitcore
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcore"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fitcore

  api:
    build:
      context: ../apps/api
      dockerfile: ../../deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://fitcore:fitcore@postgres:5432/fitcore?schema=public
      JWT_SECRET: change-me-use-a-long-random-string-here-abc123xyz
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: https://gym.nokkoo.in
      SEED_OWNER_EMAIL: owner@fitnessworld.in
      SEED_OWNER_PASSWORD: Owner@123
      SEED_DEFAULT_PASSWORD: Staff@123
    networks:
      - fitcore

  web:
    build:
      context: ../apps/web
      dockerfile: ../../deploy/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - fitcore
      - app_default

volumes:
  pgdata:

networks:
  fitcore:
    driver: bridge
  app_default:
    external: true
